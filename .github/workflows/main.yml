name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP file not found!"
            exit 1
          fi

          echo "Found: $ZIP_FILE"

          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

          echo "Extracted files:"
          find project -maxdepth 3 -type f | head -100

      - name: Locate Android project
        run: |
          if [ -f "project/gradlew" ]; then
            echo "PROJECT_DIR=project" >> $GITHUB_ENV
          else
            GRADLEW=$(find project -name gradlew -type f | head -n 1)

            if [ -z "$GRADLEW" ]; then
              echo "gradlew not found!"
              exit 1
            fi

            PROJECT_DIR=$(dirname "$GRADLEW")
            echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          fi

      - name: Make Gradle executable
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rider-salary-tracker-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
