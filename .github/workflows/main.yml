name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Find the correct ZIP file
        id: find_zip
        run: |
          ZIP_FILE="./rider-salary-tracker (4).zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: rider-salary-tracker (4).zip was not found!"
            echo "Files in repository:"
            ls -la
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract Android project
        run: |
          ZIP_FILE="${{ steps.find_zip.outputs.zip_file }}"

          mkdir -p project
          unzip -o "$ZIP_FILE" -d project

          echo "===== Extracted project structure ====="
          find project -maxdepth 4 -type f | head -200

      - name: Locate Android project
        id: locate
        run: |
          SETTINGS_FILE=$(find project -type f \( \
            -name "settings.gradle.kts" \
            -o -name "settings.gradle" \
          \) | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android Gradle project was not found!"
            find project -maxdepth 6 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 9.3.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q gradle-9.3.1-bin.zip
          echo "$PWD/gradle-9.3.1/bin" >> "$GITHUB_PATH"

          echo "===== Gradle version ====="
          gradle --version

      - name: Verify Android project
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          echo "===== Project files ====="
          ls -la

          echo "===== App module ====="
          ls -la app

      - name: Restore Fixed Debug Keystore
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          echo "===== Searching for fixed debug keystore ====="

          KEYSTORE_FILE=$(find . -type f -name "debug.keystore.base64" | head -n 1)

          if [ -z "$KEYSTORE_FILE" ]; then
            echo "ERROR: debug.keystore.base64 was not found!"
            echo "Searching project:"
            find . -type f | sort
            exit 1
          fi

          echo "Found: $KEYSTORE_FILE"

          mkdir -p "$HOME/.android"

          base64 -d "$KEYSTORE_FILE" > "$HOME/.android/debug.keystore"

          echo "===== Debug keystore restored ====="

          keytool -list \
            -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            | grep -E "Alias name:|SHA1:"

      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          gradle assembleDebug --stacktrace

      - name: Verify APK SHA-1
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          APK=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found!"
            exit 1
          fi

          echo "===== APK ====="
          echo "$APK"

          echo "===== APK signing certificate ====="
          $ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner \
            verify \
            --print-certs \
            "$APK"

      - name: Find generated APK
        run: |
          echo "===== Searching for APK ====="

          find "${{ steps.locate.outputs.project_dir }}" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rider-salary-tracker-apk
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
