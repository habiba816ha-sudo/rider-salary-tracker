name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v5


      # ============================================================
      # 2. Find ZIP
      # ============================================================
      - name: Find project ZIP
        id: find_zip
        run: |
          echo "===== FINDING ZIP ====="

          ZIP_FILE="./rider-salary-tracker (4).zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found!"
            echo "Repository files:"
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 3. Inspect ZIP contents
      # ============================================================
      - name: Inspect ZIP contents
        run: |
          echo "===== ZIP CONTENTS ====="

          unzip -l "${{ steps.find_zip.outputs.zip_file }}" | head -300

          echo ""
          echo "===== SEARCHING FOR KEYSTORE FILES ====="

          unzip -l "${{ steps.find_zip.outputs.zip_file }}" \
            | grep -Ei 'debug\.keystore|keystore|\.jks|\.p12' \
            || echo "No keystore-related file found in ZIP."


      # ============================================================
      # 4. Extract project
      # ============================================================
      - name: Extract Android project
        run: |
          echo "===== EXTRACTING PROJECT ====="

          mkdir -p project

          unzip -o "${{ steps.find_zip.outputs.zip_file }}" \
            -d project

          echo ""
          echo "===== EXTRACTED FILES ====="

          find project -maxdepth 6 -type f | head -300


      # ============================================================
      # 5. Locate Android project
      # ============================================================
      - name: Locate Android project
        id: locate
        run: |
          echo "===== LOCATING ANDROID PROJECT ====="

          SETTINGS_FILE=$(find project -type f \( \
            -name "settings.gradle.kts" \
            -o -name "settings.gradle" \
          \) | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android Gradle project not found!"

            echo "Searching all files:"
            find project -type f | head -500

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo ""
          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 6. Search for debug.keystore.base64
      # ============================================================
      - name: Find debug keystore
        id: find_keystore
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          echo "===== SEARCHING FOR debug.keystore.base64 ====="

          KEYSTORE_BASE64=$(find .. -type f \
            -name "debug.keystore.base64" \
            | head -n 1)

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo ""
            echo "ERROR:"
            echo "debug.keystore.base64 was NOT found."
            echo ""
            echo "All keystore-related files:"
            find .. -type f \
              \( \
                -name "*.keystore" \
                -o -name "*.jks" \
                -o -name "*.p12" \
                -o -name "*keystore*" \
              \) \
              -print

            exit 1
          fi

          echo ""
          echo "FOUND:"
          echo "$KEYSTORE_BASE64"

          echo "keystore_file=$KEYSTORE_BASE64" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 7. Restore fixed debug keystore
      # ============================================================
      - name: Restore fixed debug keystore
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          echo "===== RESTORING DEBUG KEYSTORE ====="

          KEYSTORE_BASE64="${{ steps.find_keystore.outputs.keystore_file }}"

          mkdir -p ~/.android

          base64 -d "$KEYSTORE_BASE64" > ~/.android/debug.keystore

          chmod 600 ~/.android/debug.keystore

          echo ""
          echo "Debug keystore restored:"
          ls -lh ~/.android/debug.keystore


      # ============================================================
      # 8. Verify keystore SHA-1
      # ============================================================
      - name: Verify debug keystore SHA-1
        run: |
          echo "===== DEBUG KEYSTORE SHA-1 ====="

          keytool \
            -list \
            -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            | grep -E "Alias name:|SHA1:|SHA-1:"


      # ============================================================
      # 9. Setup Java
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 10. Install Gradle
      # ============================================================
      - name: Install Gradle 9.3.1
        run: |
          echo "===== INSTALLING GRADLE ====="

          wget -q \
            https://services.gradle.org/distributions/gradle-9.3.1-bin.zip

          unzip -q gradle-9.3.1-bin.zip

          echo "$PWD/gradle-9.3.1/bin" >> "$GITHUB_PATH"

          echo ""
          echo "===== GRADLE VERSION ====="

          gradle --version


      # ============================================================
      # 11. Verify Android project
      # ============================================================
      - name: Verify Android project
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          echo "===== PROJECT FILES ====="
          ls -la

          echo ""
          echo "===== APP MODULE ====="
          ls -la app


      # ============================================================
      # 12. Show applicationId and signing configuration
      # ============================================================
      - name: Inspect Gradle configuration
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          echo "===== APPLICATION ID ====="

          grep -R \
            'applicationId' \
            app/build.gradle.kts \
            || true

          echo ""
          echo "===== SIGNING CONFIGURATION ====="

          grep -n -A20 -B5 \
            'signingConfigs' \
            app/build.gradle.kts \
            || true


      # ============================================================
      # 13. Clean
      # ============================================================
      - name: Clean project
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          echo "===== CLEANING PROJECT ====="

          gradle clean --stacktrace


      # ============================================================
      # 14. Build Debug APK
      # ============================================================
      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          echo "===== BUILDING DEBUG APK ====="

          gradle assembleDebug --stacktrace


      # ============================================================
      # 15. Verify APK
      # ============================================================
      - name: Verify APK SHA-1
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          echo "===== FINDING APK ====="

          APK=$(find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK NOT FOUND!"
            exit 1
          fi

          echo ""
          echo "APK:"
          echo "$APK"

          echo ""
          echo "===== APK CERTIFICATE ====="

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name "apksigner" \
            | sort -V \
            | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found!"
            exit 1
          fi

          "$APKSIGNER" \
            verify \
            --print-certs \
            "$APK"


      # ============================================================
      # 16. Show APK files
      # ============================================================
      - name: Find generated APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          echo "===== GENERATED APK FILES ====="

          find app/build/outputs \
            -type f \
            -name "*.apk" \
            -print


      # ============================================================
      # 17. Upload APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rider-salary-tracker-apk
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
