name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Find ZIP file
        id: find_zip
        run: |
          ZIP_FILE=$(find . -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found!"
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract project
        run: |
          ZIP_FILE="${{ steps.find_zip.outputs.zip_file }}"

          mkdir -p project
          unzip -o "$ZIP_FILE" -d project

          echo "Project files:"
          find project -maxdepth 3 -type f | head -100

      - name: Locate Android project
        id: locate
        run: |
          GRADLE_FILE=$(find project -type f -name "settings.gradle.kts" | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: Android Gradle project not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")

          echo "Android project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "===== APK files ====="
          find "${{ steps.locate.outputs.project_dir }}" \
            -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rider-salary-tracker-apk
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
