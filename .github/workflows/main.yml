name: Diagnose Android Project

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check ZIP
        run: |
          echo "===== REPOSITORY FILES ====="
          find . -maxdepth 3 -type f -print

          ZIP_FILE="./rider-salary-tracker (4).zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found!"
            exit 1
          fi

          echo "ZIP FOUND: $ZIP_FILE"

      - name: Inspect ZIP contents
        run: |
          ZIP_FILE="./rider-salary-tracker (4).zip"

          echo ""
          echo "======================================"
          echo "        ZIP CONTENTS"
          echo "======================================"

          unzip -l "$ZIP_FILE"

      - name: Extract project
        run: |
          ZIP_FILE="./rider-salary-tracker (4).zip"

          mkdir -p project
          unzip -o "$ZIP_FILE" -d project

          echo ""
          echo "======================================"
          echo "       PROJECT STRUCTURE"
          echo "======================================"

          find project -maxdepth 6 -type f -print | sort

      - name: Locate Android project
        id: locate
        run: |
          SETTINGS_FILE=$(find project -type f \( \
            -name "settings.gradle.kts" \
            -o -name "settings.gradle" \
          \) | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle(.kts) not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Find keystore files
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          echo ""
          echo "======================================"
          echo "        KEYSTORE FILES"
          echo "======================================"

          find . -type f \( \
            -iname "*.keystore" \
            -o -iname "*.jks" \
            -o -iname "*.base64" \
          \) -print

          echo ""
          echo "Checking specifically for debug.keystore.base64..."

          if find . -type f -name "debug.keystore.base64" | grep -q .; then
            echo "FOUND: debug.keystore.base64"
          else
            echo "NOT FOUND: debug.keystore.base64"
          fi

      - name: Inspect Gradle signing configuration
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          echo ""
          echo "======================================"
          echo "        GRADLE CONFIGURATION"
          echo "======================================"

          if [ -f "app/build.gradle.kts" ]; then
            echo ""
            echo "===== app/build.gradle.kts ====="

            grep -n -E \
              "applicationId|namespace|signingConfigs|signingConfig|debug|release|keystore|storeFile|keyAlias" \
              app/build.gradle.kts || true
          else
            echo "ERROR: app/build.gradle.kts not found!"
          fi

      - name: Inspect Google configuration
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          echo ""
          echo "======================================"
          echo "        GOOGLE CONFIGURATION
          ======================================"

          echo "google-services.json files:"
          find . -type f -name "google-services.json" -print

          echo ""
          echo "OAuth / Google related files:"
          find . -type f | grep -Ei \
            "google|oauth|firebase|drive|credential" || true

      - name: Inspect workflow
        run: |
          echo ""
          echo "======================================"
          echo "        WORKFLOW FILES"
          echo "======================================"

          find .github/workflows -type f -maxdepth 2 -print

      - name: Summary
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          echo ""
          echo "======================================"
          echo "        DIAGNOSTIC SUMMARY"
          echo "======================================"

          echo ""
          echo "Application ID:"
          grep -n "applicationId" app/build.gradle.kts || true

          echo ""
          echo "Namespace:"
          grep -n "namespace" app/build.gradle.kts || true

          echo ""
          echo "Debug signing configuration:"
          grep -n -A8 -B3 "debug" app/build.gradle.kts || true

          echo ""
          echo "Keystore files:"
          find . -type f \( \
            -iname "*.keystore" \
            -o -iname "*.jks" \
            -o -iname "*.base64" \
          \) -print

          echo ""
          echo "======================================"
          echo "        DIAGNOSTIC COMPLETE"
          echo "======================================"
